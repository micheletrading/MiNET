#DO NOT REMOVE THIS LINE - MiNET Config

#UseEncryption=false
#UseEncryptionForAll=true
#ForceOrderingForAll=false
#ForceXBLAuthentication=false

motd=MiNET Server
motd-2nd=
port=19132

# true: chunk palettes carry block network hashes, which the client resolves by name and state.
# false: chunk palettes carry runtime ids, which the client resolves positionally against its own
# palette, so our palette order has to match the client's exactly.
#BlockNetworkIdsAreHashes=false

# Serve chunks as content-addressed blobs to clients that keep a cache, so a returning player
# re-downloads only the sections that actually changed. Negotiated per client; anyone who declines
# gets ordinary chunks.
BlobCache.Enabled=true
#BlobCache.MaxBytes=256

# Identify a block state by a hash of its name and properties rather than by its position in the
# palette. Hashes are what vanilla uses by default from 1.26.40; indices only work when our palette
# is ordered exactly like the client's, which is why Mojang moved away from them. The server tells
# the client which scheme it uses in StartGame, so both are legal, but a server on a current
# protocol wants hashes.
#BlockNetworkIdsAreHashes=false

# Refuse anyone who is not signed in to Xbox Live. This verifies the login token's signature
# against Mojang's published keys, then checks that the client data is signed by the key the token
# names, so the gamertag and XUID cannot simply be typed in. Off means the identity a client
# claims is taken at its word, which is fine for local play and not for a public server.
#ForceXBLAuthentication=false
#ForceXBLLogin=You must authenticate to XBOX Live to join this server.

ViewDistance=20
MaxViewDistance=8
MoveRenderDistance=1
CalculateLights=true

# Game mode and rules
GameMode=Survival
#GameMode=Creative
Player.GameMode=Survival
CheckForSafeSpawn=true
EnableBlockTicking=true
EnableChunkTicking=true
GameRule.DoMobspawning=true
GameRule.DoDaylightcycle=true
GameRule.KeepInventory=true
ServerInfoInTitle=true


PCWorldFolder=D:\Development\DOES NOT EXIST
