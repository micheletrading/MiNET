EnableCommands=true

PluginDirectory=../../../../TestPlugin/bin/Debug/net6.0;../../../../MiNET.BuilderBase/bin/Debug/netcoreapp2.1;../../../../MiNET.Plotter/bin/Debug/netcoreapp2.1

#PluginDisabled=true
