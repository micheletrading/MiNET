# The parking server as it runs on the public box, deployed to /opt/minet.
#
# Only settings that differ from MiNET's own defaults are here. Anything absent is a default.

ip=0.0.0.0
port=19132

# The public IP sits directly on the NIC, so the host candidates the SDP answer carries are already
# dialable and no address rewrite is needed. This line is here to PIN the UDP port: without it the
# mux binds an ephemeral one, which the firewall does not have a rule for and never will.
server-udp-ports=19132

motd=Parking
# A thousand-plus bots starve threads long enough that healthy sessions look silent on the
# default 8.5s and get swept.
InactivityTimeout=60000
MaxNumberOfPlayers=5000

# Nothing but air, and an Anvil folder that does not exist so the generator is all there is. The
# default provider is leveldb, which would create a database on disk instead.
# The LEVEL's mode, which is what StartGame's gameType Default resolves to. Set here rather than
# per player: the client is then told spectator at spawn and nothing has to correct it afterwards.
# Nothing here grows, moves, spawns or saves, so the 50ms world tick has nothing to do. It also
# stops Player.OnTick, and with it hunger, effects, portal detection, popups and the adaptive
# chunk radius; the plugin runs its own one-second timer for the spline and the countdown.
EnableLevelTicking=false

GameMode=Spectator

WorldGenerator=air
WorldProvider=anvil
PCWorldFolder=/opt/minet/world-does-not-exist

# A room made of nothing needs no distance, and it makes the join instant.
ViewDistance=5
MaxViewDistance=5

# For /back. Game mode is NOT set here: the join burst puts it back to the level's own, so the
# plugin sets it after joining instead.
EnableCommands=true

# Doors. A player registers one in world, which is already an authenticated act, and gets back a
# port from this range. Everyone arriving on that port goes back where its owner said, and the port
# is the only credential the HTTP side needs, because a port is only ever learned by being handed
# one. The firewall has to allow this whole range as TCP; the UDP path is shared and stays 19132.
Parking.PortRange=19500-19600

# What a registration tells its owner to hand out. Has to be an address the CLIENT can reach.
Parking.PublicAddress=57.131.139.219

# Where anyone who walked in the front entrance goes. They came without a door, so all we can
# honestly offer is their own machine.
Parking.DefaultBack=127.0.0.1:19132

PluginDirectory=/opt/minet/plugins

# Loopback only. It is an unauthenticated-by-design shell into the server, and the box is public;
# reaching it means already being on the box, or forwarding it over ssh.
RemoteConsole.Enabled=true
RemoteConsole.BindAddress=127.0.0.1
RemoteConsole.Port=19141
RemoteConsole.Secret=a4c7a08356f7ac447800f180dd69d548e702e4ceac9521364d9edb53852c9555
RemoteConsole.TransferAddress=57.131.139.219


# Packets never sent from here, by class name. One join measured 1059 KB, of which these four were
# 992 KB: recipes, item components, the creative inventory and jigsaw structures. A spectator held
# inside a hollow cube uses none of them.
Parking.Suppress=McpeCraftingData,McpeItemComponent,McpeCreativeContent,McpeJigsawStructureData,McpePlayerList,McpeAvailableEntityIdentifiers,McpeBiomeDefinitionList,McpeTrimData,McpeCameraAimAssistPresets,McpeSyncEntityProperty,McpeUpdateAttributes,McpeInventoryContent,McpeGameRulesChanged,McpeSyncWorldClocks,McpeVoxelShapes,McpeLevelEventGeneric,McpeCurrentStructureFeature,McpePlayerHotbar,McpeSetHealth,McpeSetDifficulty,McpePlayerFog,McpeSetSpawnPosition,McpeAddPlayer,McpeRemoveEntity,McpeSetEntityData,McpeWrapper

# Dropped on arrival. A client reports position 20 times a second whatever we tell it, and nothing
# here moves, so the handler only ever queues a chunk pass that finds nothing to do. Diagnostics is
# pure telemetry. Dropped after decode, which is the earliest a plugin can reach.
Parking.SuppressIn=McpePlayerAuthInput,McpeServerBoundDiagnostics
