#DO NOT REMOVE THIS LINE - MiNET Config

# MiNET.Tunnel - MITM proxy between a real client and a vanilla BDS.
# The downstream leg is a normal MiNET server on this port; the upstream
# target comes from MINET_TUNNEL_TARGET (default 127.0.0.1:19132).
port=19134
MaxNumberOfPlayers=10

motd=MiNET Tunnel
motd-2nd=MITM

ForceXBLAuthentication=false
ServerInfoInTitle=false

# The downstream leg is a full MiNetServer so it makes a level, but nothing here is ever sent:
# every chunk the client sees comes from upstream. Keep it cheap and never write it to disk.
GameMode=Creative
CheckForSafeSpawn=false
CalculateLights=false
EnableBlockTicking=false
EnableChunkTicking=false
GameRule.DoMobspawning=false
Save.Enabled=false

PluginDisabled=true

BlockNetworkIdsAreHashes=true
