name: .NET Core

on: 
  push:
    branches:
      - master

jobs:
  nuget:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for an OIDC token, which nuget.org trades for a
      # short-lived key. Without it the token request fails quietly.
      id-token: write
    steps:
      - uses: actions/checkout@v1
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.*

      - name: Generate build number
        id: buildnumber
        uses: einaregilsson/build-number@v3
        with:
          token: ${{secrets.github_token}}    
        
      - name: Dotnet Restore
        working-directory: src/MiNET/MiNET
        run: dotnet restore

      - name: Test
        working-directory: src/MiNET
        run: dotnet test MiNET.Test/MiNETTests.csproj --configuration Release

      - name: Build & Pack
        working-directory: src/MiNET/MiNET
        run: |
          export PKG_VERSION=1.0.${{ steps.buildnumber.outputs.build_number }}
          dotnet build --configuration Release
          dotnet pack --configuration Release -o ./nuget -p:PackageVersion="$PKG_VERSION" --include-symbols --include-source
      
      # Trusted publishing: nuget.org checks the token's repository, workflow file and
      # owner against the trust policy on the account and issues a key that expires
      # shortly after. There is no stored API key to leak or to expire unnoticed.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: gurun

      - name: Publish Artifacts
        shell: bash
        working-directory: src/MiNET/MiNET
        run: dotnet nuget push ./nuget/*.symbols.nupkg -s "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
