name: .NET Core

on: 
  push:
    branches:
      - master

jobs:
  nuget:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the build number is stored as a git ref by the counter
      # action, and naming permissions at all replaces the defaults rather than
      # adding to them.
      contents: write
      # Lets the job ask GitHub for an OIDC token, which nuget.org trades for a
      # short-lived key. Without it the token request fails quietly.
      id-token: write
    steps:
      - uses: actions/checkout@v1
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.*

      - name: Generate build number
        id: buildnumber
        uses: einaregilsson/build-number@v3
        with:
          token: ${{secrets.github_token}}    
        
      # The package version follows the game: three fields from the protocol definition,
      # which is the one place the target version is declared, and the build counter
      # fourth. Bedrock sometimes names a fourth field of its own (1.26.30.5), so the
      # game version is truncated to three to keep ours always the fourth.
      - name: Compose package version
        id: pkgversion
        run: |
          GAME_VERSION=$(grep -oP 'gameVersion="\K[0-9.]+' "src/MiNET/MiNET/Net/MCPE Protocol.xml")
          if [ -z "$GAME_VERSION" ]; then echo "No gameVersion in MCPE Protocol.xml" >&2; exit 1; fi
          PKG_VERSION="$(echo "$GAME_VERSION" | cut -d. -f1-3).${{ steps.buildnumber.outputs.build_number }}"
          echo "Game version $GAME_VERSION, package version $PKG_VERSION"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Dotnet Restore
        working-directory: src/MiNET/MiNET
        run: dotnet restore

      - name: Test
        working-directory: src/MiNET
        run: dotnet test MiNET.Test/MiNETTests.csproj --configuration Release

      - name: Build & Pack
        working-directory: src/MiNET/MiNET
        run: |
          dotnet build --configuration Release
          dotnet pack --configuration Release -o ./nuget -p:PackageVersion="${{ steps.pkgversion.outputs.version }}" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      
      # Trusted publishing: nuget.org checks the token's repository, workflow file and
      # owner against the trust policy on the account and issues a key that expires
      # shortly after. There is no stored API key to leak or to expire unnoticed.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: gurun

      # Pushing the .nupkg also pushes the .snupkg sitting beside it. The old
      # .symbols.nupkg was never indexable: nuget.org's symbol server takes .snupkg only,
      # so what we published was the package with sources and PDBs folded into it.
      - name: Publish Artifacts
        shell: bash
        working-directory: src/MiNET/MiNET
        run: dotnet nuget push ./nuget/*.nupkg -s "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
